<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Page not found – Interview Questions &amp; Answers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5; url=/interview-questions/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <style>
    :root {
      --brand: #512bd4;
      --brand-2: #0ea5e9;
      --bg: #ffffff;
      --text: #2b2b3a;
      --muted: #6b6b80;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --brand: #a78bfa;
        --brand-2: #38bdf8;
        --bg: #0f0f17;
        --text: #d4d4e0;
        --muted: #9a9ab0;
      }
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }

    .code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h1 {
      margin: 0.5rem 0;
      font-size: 1.5rem;
    }

    p {
      color: var(--muted);
    }

    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.7em 1.8em;
      border-radius: 999px;
      background: var(--brand);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main>

  </main>
</body>

</html>
